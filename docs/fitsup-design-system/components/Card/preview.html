<!-- @dsCard group="Content" height=520 subtitle="스타일 카드 · 단계 카드 · 저장한 디자인 카드" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Rubik+Spray+Paint&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
h3{margin:0;font-size:22px;line-height:1.4;font-weight:700}
p{margin:0}
.style{display:flex;flex-direction:column;background:var(--ground);border-radius:var(--radius-card);padding:14px}
.photo{aspect-ratio:4/5;max-height:220px;border-radius:var(--radius-md);background:var(--placeholder);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);font-size:14px;font-weight:500}
.info{display:flex;flex-direction:column;align-items:flex-start;padding:22px 8px 8px}
.desc{margin:10px 0 24px;font-size:16px;line-height:1.75;color:var(--text-muted)}
.sec{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;background:var(--surface);border:var(--border-line) solid var(--ink);border-radius:var(--radius-pill);font:700 16px var(--font-sans);color:var(--ink)}
.step{background:var(--surface);border:var(--border-line) solid var(--ink);border-radius:var(--radius-card);padding:36px 32px 40px}
.num{display:block;font-family:var(--font-display);font-size:64px;line-height:1}
.step h3{margin:24px 0 12px;font-size:24px}
.saved{display:flex;flex-direction:column;padding:14px;background:var(--surface);border:var(--border-line) solid var(--ink);border-radius:var(--radius-card)}
.thumb{display:flex;align-items:center;justify-content:center;height:140px;background:var(--ground);border-radius:var(--radius-md)}
.deck{fill:url(#ck)} .wheel{fill:var(--deck-black)} .ln{stroke:var(--ink)} .pp{fill:var(--deck-white)} .pb{fill:var(--deck-blue)}
.phrase{font-family:var(--font-deck-spray);fill:var(--ink);stroke:var(--surface);stroke-width:3px;paint-order:stroke}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.pri{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;background:var(--brand);color:var(--on-brand);border:var(--border-action) solid var(--ink);border-radius:var(--radius-pill);box-shadow:var(--shadow-action-sm);font:700 15px var(--font-sans)}
</style>
</head>
<body>
<div class="grid">
<article class="style">
<div class="photo" role="img" aria-label="카빙 라이딩 사진 자리"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>라이딩 사진 자리</div>
<div class="info"><h3>카빙</h3><p class="desc">몸을 좌우로 기울여 S자 커브를 부드럽게 그려요.</p><button class="sec" type="button">카빙으로 시작하기 →</button></div>
</article>
<article class="step"><span class="num" aria-hidden="true">02</span><h3>내 맘대로 꾸미기</h3><p class="desc" style="margin:0">덱·바퀴·트럭 색, 덱 무늬, 덱 문구를 고르면 완성 모습이 바로 바뀌어요.</p></article>
<article class="saved">
<div class="thumb"><svg width="220" height="88" viewBox="0 0 150 60" role="img" aria-label="블루 체커 덱, 블랙 바퀴, 스프레이 스타일 leeeee 문구 보드 윗면"><defs><pattern id="ck" width="12" height="12" patternUnits="userSpaceOnUse"><rect class="pb" width="12" height="12"/><rect class="pp" width="6" height="6"/><rect class="pp" x="6" y="6" width="6" height="6"/></pattern></defs><rect class="wheel ln" x="26" y="4" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="wheel ln" x="26" y="46" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="wheel ln" x="108" y="4" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="wheel ln" x="108" y="46" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="deck ln" x="3" y="11" width="144" height="38" rx="19" stroke-width="3"/><text class="phrase" x="75" y="37" text-anchor="middle" font-size="18" transform="rotate(-4 75 30)">leeeee</text></svg></div>
<div class="info"><p style="font-size:19px;font-weight:700;line-height:1.5">블루 카빙 보드 · 32인치</p><p class="desc" style="font-size:15px;margin:6px 0 20px">카빙 · 32인치 · 블루 덱 · 블랙 바퀴 · 실버 트럭 · 체커 · 문구 "leeeee"</p><div class="btns"><button class="sec" type="button" style="font-size:15px">다시 꾸미기</button><button class="pri" type="button">장바구니 담기</button></div></div>
</article>
</div>
</body>
</html>

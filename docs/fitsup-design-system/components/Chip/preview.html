<!-- @dsCard group="Status" height=120 subtitle="표시 칩 · 추천 칩 · 개수 배지" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:var(--border-line) solid var(--ink);border-radius:var(--radius-pill);background:var(--surface);font-size:15px;font-weight:700}
.chip.info{background:var(--ground);font-size:14px}
.rec{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--radius-pill);background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:700}
.count{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:var(--radius-pill);background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="row">
<span class="chip">크루저 보드 · 22 / 27 / 32인치</span>
<span class="chip info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.01"/></svg>내 디자인은 로그인한 뒤 볼 수 있어요.</span>
<span class="rec">추천</span>
<span class="count">장바구니<span class="badge">2</span></span>
</div>
</body>
</html>

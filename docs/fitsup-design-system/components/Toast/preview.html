<!-- @dsCard group="Feedback" height=120 subtitle="담기·저장 완료 알림 · 6초" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);word-break:keep-all}
.toast{max-width:640px;box-sizing:border-box;padding:14px 14px 14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--on-ink);border-radius:var(--radius-toast);box-shadow:var(--shadow-toast)}
.msg{flex:1 1 auto;font-size:17px;font-weight:700}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:var(--border-line) solid var(--on-ink);border-radius:var(--radius-pill);font-size:15px;font-weight:700;color:var(--on-ink);text-decoration:none}
button{min-height:44px;padding:0 14px;border:0;background:transparent;font:500 15px var(--font-sans);color:var(--on-ink);text-decoration:underline;text-underline-offset:5px}
</style>
</head>
<body>
<div class="toast" role="status"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4.5 4.5L19 7"/></svg><span class="msg">장바구니에 담았어요.</span><a href="#">장바구니 보기</a><button type="button">계속 꾸미기</button></div>
</body>
</html>

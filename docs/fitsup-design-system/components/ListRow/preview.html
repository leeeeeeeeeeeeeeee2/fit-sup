<!-- @dsCard group="Content" height=170 width=1100 subtitle="장바구니 · 주문 확인 목록 행" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.row{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:20px 24px;background:var(--surface);border:var(--border-line) solid var(--ink);border-radius:var(--radius-card)}
.th{flex:none;display:flex;align-items:center;justify-content:center;width:180px;height:104px;background:var(--ground);border-radius:var(--radius-md)}
.txt{flex:1 1 360px;min-width:0}
p{margin:0}
.n{font-size:18px;font-weight:700;line-height:1.5}
.s{margin-top:6px;font-size:15px;line-height:1.7;color:var(--text-muted)}
.price{width:120px;font-size:18px;font-weight:700}
.del{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;background:var(--surface);border:var(--border-line) solid var(--ink);border-radius:var(--radius-pill);font:700 15px var(--font-sans);color:var(--ink)}
.pb{fill:var(--deck-blue)} .pp{fill:var(--deck-white)} .wh{fill:var(--deck-black);stroke:var(--ink)} .dk{fill:url(#ck2);stroke:var(--ink)}
.ph{font-family:var(--font-deck-spray);fill:var(--ink);stroke:var(--surface);stroke-width:3px;paint-order:stroke}
</style>
</head>
<body>
<div class="row">
<span class="th"><svg width="150" height="60" viewBox="0 0 150 60" role="img" aria-label="블루 체커 덱, 블랙 바퀴, 스프레이 스타일 leeeee 문구 보드 윗면"><defs><pattern id="ck2" width="12" height="12" patternUnits="userSpaceOnUse"><rect class="pb" width="12" height="12"/><rect class="pp" width="6" height="6"/><rect class="pp" x="6" y="6" width="6" height="6"/></pattern></defs><rect class="wh" x="26" y="4" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="wh" x="26" y="46" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="wh" x="108" y="4" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="wh" x="108" y="46" width="16" height="10" rx="4" stroke-width="2.5"/><rect class="dk" x="3" y="11" width="144" height="38" rx="19" stroke-width="3"/><text class="ph" x="75" y="37" text-anchor="middle" font-size="18" transform="rotate(-4 75 30)">leeeee</text></svg></span>
<div class="txt"><p class="n">블루 카빙 보드 · 32인치 · 수량 1개</p><p class="s">카빙 · 32인치 · 블루 덱 · 블랙 바퀴 · 실버 트럭 · 체커 · 문구 "leeeee"</p></div>
<p class="price">가격 미정</p>
<button class="del" type="button" aria-label="블루 카빙 보드 삭제"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>삭제</button>
</div>
</body>
</html>

<!-- @dsCard group="Forms" height=200 subtitle="기본 · 오류" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.f{display:flex;flex-direction:column;gap:10px}
label{font-size:16px;font-weight:700}
input{height:56px;box-sizing:border-box;padding:0 18px;border:var(--border-line) solid var(--ink);border-radius:var(--radius-md);background:var(--surface);font:17px var(--font-sans);color:var(--ink)}
input[aria-invalid="true"]{border:var(--border-action) solid var(--error)}
input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{margin:0;display:flex;gap:6px;font-size:14px;font-weight:700;line-height:1.6;color:var(--error)}
</style>
</head>
<body>
<div class="grid">
<div class="f"><label for="h">키 (cm)</label><input id="h" placeholder="키를 입력해 주세요 · 예: 170" value="172"></div>
<div class="f"><label for="t">연락처</label><input id="t" value="010-12ab" aria-invalid="true" aria-describedby="te"><p class="err" id="te"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.01"/></svg>연락처를 숫자로 입력해 주세요. 예: 010-1234-5678</p></div>
</div>
</body>
</html>

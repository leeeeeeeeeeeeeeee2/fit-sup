<!-- @dsCard group="Selection" height=560 subtitle="길이 구간 · 부품 탭 · 색 · 무늬 · 문구 스타일" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Rubik+Spray+Paint&family=Permanent+Marker&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.wrap{max-width:480px;display:flex;flex-direction:column;gap:28px}
.lbl{margin:0 0 12px;font-size:16px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;gap:4px;background:var(--surface);border:var(--border-line) solid var(--ink);border-radius:var(--radius-pill)}
.seg button{min-height:48px;border:0;border-radius:var(--radius-pill);background:transparent;font:500 16px var(--font-sans);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:700}
.tabs{display:flex;gap:8px;border-bottom:var(--border-line) solid var(--ink)}
.tabs button{min-height:48px;padding:0 22px;border:var(--border-line) solid var(--ink);border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;background:var(--surface);font:500 16px var(--font-sans);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink);font-weight:700}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;background:transparent;font:500 14px var(--font-sans);color:var(--ink)}
.ring{display:block;padding:3px;border:var(--border-action) solid transparent;border-radius:var(--radius-pill)}
.sw button[aria-pressed="true"] .ring{border-color:var(--ink)}
.sw button[aria-pressed="true"]{font-weight:700}
.dot{display:block;width:40px;height:40px;box-sizing:border-box;border-radius:var(--radius-pill);border:var(--border-line) solid var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border:var(--border-line) solid var(--line-soft);border-radius:var(--radius-md);background:var(--surface);font:500 14px var(--font-sans);color:var(--ink)}
.tiles button[aria-pressed="true"]{border:var(--border-action) solid var(--ink);font-weight:700}
.aa{display:block;height:40px;line-height:40px;font-size:28px}
.hex{display:flex;align-items:center;height:48px;padding:0 16px;box-sizing:border-box;border:var(--border-line) solid var(--ink);border-radius:var(--radius-md);background:var(--surface)}
.hex input{flex:1;min-width:0;height:44px;margin-left:6px;border:0;background:transparent;font:17px var(--font-sans);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<div><p class="lbl">보드 길이 (바꿀 수 있어요)</p><div class="seg"><button type="button" aria-pressed="false">22인치</button><button type="button" aria-pressed="false">27인치</button><button type="button" aria-pressed="true">32인치</button></div></div>
<div><p class="lbl">꾸밀 부품</p><div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true">덱</button><button type="button" role="tab" aria-selected="false">바퀴</button><button type="button" role="tab" aria-selected="false">트럭</button></div></div>
<div><p class="lbl">덱 색상</p><div class="sw">
<button type="button" aria-pressed="false"><span class="ring"><span class="dot" style="background:var(--deck-mint)"></span></span>민트</button>
<button type="button" aria-pressed="false"><span class="ring"><span class="dot" style="background:var(--deck-white)"></span></span>화이트</button>
<button type="button" aria-pressed="false"><span class="ring"><span class="dot" style="background:var(--deck-coral)"></span></span>코랄</button>
<button type="button" aria-pressed="true"><span class="ring"><span class="dot" style="background:var(--deck-blue)"></span></span>블루</button>
<button type="button" aria-pressed="false"><span class="ring"><span class="dot" style="background:var(--deck-gray)"></span></span>그레이</button>
<button type="button" aria-pressed="false"><span class="ring"><span class="dot" style="background:var(--deck-black)"></span></span>블랙</button>
</div>
<label for="hex" style="display:block;margin:16px 0 8px;font-size:14px;font-weight:700">직접 입력</label><div class="hex"><span aria-hidden="true" style="font-weight:700">#</span><input id="hex" maxlength="6" placeholder="1E3FD0"></div></div>
<div><p class="lbl">문구 스타일</p><div class="tiles">
<button type="button" aria-pressed="false"><span class="aa" style="font-family:var(--font-deck-marker)">Aa</span>페인트</button>
<button type="button" aria-pressed="true"><span class="aa" style="font-family:var(--font-deck-spray);font-size:30px">Aa</span>스프레이 ✓</button>
<button type="button" aria-pressed="false"><span class="aa" style="font-family:var(--font-deck-pen);font-size:34px">Aa</span>펜</button>
<button type="button" aria-pressed="false"><span class="aa" style="font-family:var(--font-display)">Aa</span>두꺼운</button>
</div></div>
</div>
</body>
</html>

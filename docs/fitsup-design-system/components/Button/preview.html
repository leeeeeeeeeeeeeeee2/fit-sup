<!-- @dsCard group="Actions" height=200 subtitle="주요 · 보조 · 텍스트 · 어두운 바탕" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.btn{display:inline-flex;align-items:center;gap:10px;box-sizing:border-box;border-radius:var(--radius-pill);font-family:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.primary{height:64px;padding:0 34px;background:var(--brand);color:var(--on-brand);border:var(--border-action) solid var(--ink);box-shadow:var(--shadow-action);font-size:20px}
.primary-sm{height:48px;padding:0 22px;background:var(--brand);color:var(--on-brand);border:var(--border-action) solid var(--ink);box-shadow:var(--shadow-action-sm);font-size:15px}
.secondary{min-height:48px;padding:0 20px;background:var(--surface);color:var(--ink);border:var(--border-line) solid var(--ink);font-size:16px}
.text{min-height:44px;padding:0 12px;background:transparent;border:0;color:var(--ink);font-size:16px;font-weight:500;text-decoration:underline;text-underline-offset:5px}
.ink{margin-top:20px;padding:16px 20px;background:var(--ink);border-radius:var(--radius-toast);display:flex;gap:12px;align-items:center}
.on-ink{min-height:44px;padding:0 18px;border:var(--border-line) solid var(--on-ink);color:var(--on-ink);background:transparent;font-size:15px}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
<div class="row">
<button class="btn primary" type="button">보드 만들기 시작<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
<button class="btn primary-sm" type="button">장바구니 담기</button>
<button class="btn secondary" type="button">카빙으로 시작하기<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
<button class="btn text" type="button">추천 건너뛰기</button>
</div>
<div class="ink"><button class="btn on-ink" type="button">장바구니 보기</button><button class="btn text" type="button" style="color:var(--on-ink)">계속 꾸미기</button></div>
</body>
</html>

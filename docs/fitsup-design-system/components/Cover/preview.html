<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
body{width:960px;height:288px;position:relative;overflow:hidden;background:var(--ground);font-family:var(--font-sans)}
svg{position:absolute;inset:0}
.brand{fill:var(--brand)} .ink{fill:var(--ink)} .paper{fill:var(--surface)} .line{stroke:var(--ink);stroke-width:var(--border-action);fill:none}
.text{position:absolute;left:40px;bottom:32px;max-width:440px}
.name{margin:0;font-family:var(--font-display);font-size:120px;line-height:.92;color:var(--ink)}
.tag{margin:12px 0 0;font-size:14px;color:var(--text-muted)}
</style>
</head>
<body>
<!--
blocks: brand 288×208 (radius-card), ink 144×288 slab bleeding off top/bottom/right, surface 288×64 checker strip
arrangement: one tall ink slab at the right edge with the blue block and a checker strip stacked beside it, all right of x=480
pattern: checker at space-4 (16px) pitch in ink on surface — the brand's skate-deck checker, and its loud, sticker-like poster tone
steps & radii: space-4 pitch, space-6 gaps (24px), radius-card 20px, radius-pill for the deck silhouette on the blue block
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<defs><pattern id="cv-ck" width="32" height="32" patternUnits="userSpaceOnUse"><rect class="paper" width="32" height="32"/><rect class="ink" width="16" height="16"/><rect class="ink" x="16" y="16" width="16" height="16"/></pattern></defs>
<rect class="brand" x="504" y="-20" width="288" height="228" rx="20"/>
<rect class="paper" x="548" y="76" width="200" height="56" rx="28"/>
<rect class="line" x="548" y="76" width="200" height="56" rx="28"/>
<rect x="504" y="224" width="288" height="64" fill="url(#cv-ck)"/>
<rect class="ink" x="816" y="-20" width="164" height="328" rx="20"/>
</svg>
<div class="text"><p class="name">핏썹</p><p class="tag">사이즈는 딱 맞게, 디자인은 내 맘대로.</p></div>
</body>
</html>
